<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — DOOOQQQQ</title>
  <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand" aria-label="DOOOQQQQ — home">
      <img class="brand__logo" src="assets/img/logo.png" alt="DOOOQQQQ"
           onerror="this.closest('.brand').classList.add('is-fallback');" />
      <span class="brand__text">DOOOQQQQ</span>
    </a>
    <div class="header__right">
      <a href="index.html" class="btn-contact">Close</a>
    </div>
  </header>

  <main>
    <section class="contact">
      <!-- Step indicator -->
      <div class="steps">
        <span class="steps__item active" data-step-label="0">Date</span>
        <span class="steps__sep">—</span>
        <span class="steps__item" data-step-label="1">Service</span>
        <span class="steps__sep">—</span>
        <span class="steps__item" data-step-label="2">Details</span>
      </div>

      <form id="wizard">
        <!-- Step 1: Date -->
        <div class="step active" data-step="0">
          <h2 class="step__title">Select a Date</h2>
          <div class="cal">
            <div class="cal__head">
              <button type="button" class="cal__nav" id="calPrev" aria-label="Previous month">&#8249;</button>
              <span class="cal__month" id="calMonth"></span>
              <button type="button" class="cal__nav" id="calNext" aria-label="Next month">&#8250;</button>
            </div>
            <div class="cal__grid" id="calGrid"></div>
          </div>
          <div class="step__nav">
            <span></span>
            <button type="button" class="btn btn--primary" data-next disabled>Next</button>
          </div>
        </div>

        <!-- Step 2: Service -->
        <div class="step" data-step="1">
          <h2 class="step__title">Type of Service</h2>
          <div class="services">
            <button type="button" class="service-opt" data-value="Photo">Photo</button>
            <button type="button" class="service-opt" data-value="Video">Video</button>
            <button type="button" class="service-opt" data-value="Creative Direction">Creative Direction</button>
            <button type="button" class="service-opt" data-value="Design">Design</button>
          </div>
          <div class="step__nav">
            <button type="button" class="btn btn--ghost" data-back>Back</button>
            <button type="button" class="btn btn--primary" data-next disabled>Next</button>
          </div>
        </div>

        <!-- Step 3: Details -->
        <div class="step" data-step="2">
          <h2 class="step__title">Details</h2>
          <div class="form">
            <input class="field" type="text" name="name" placeholder="Name" required />
            <input class="field" type="email" name="email" placeholder="Email" required />
            <input class="field" type="text" name="instagram" placeholder="@instagram" />
            <div class="form__row">
              <select class="field" name="budget" required>
                <option value="" disabled selected>Budget</option>
                <option value="Not specified">Not specified</option>
                <option value="Flexible">Flexible</option>
                <option value="Up to €150">Up to €150</option>
                <option value="€150–300">€150–300</option>
                <option value="€300–450">€300–450</option>
                <option value="€450–600">€450–600</option>
                <option value="€600–900">€600–900</option>
                <option value="€900–1200">€900–1200</option>
                <option value="€1200+">€1200+</option>
              </select>
              <input class="field" type="text" name="location" placeholder="Location" />
            </div>
            <textarea class="field" name="idea" placeholder="Tell me your idea briefly"></textarea>
          </div>
          <div class="step__nav">
            <button type="button" class="btn btn--ghost" data-back>Back</button>
            <button type="submit" class="btn btn--primary btn--submit">Send Request</button>
          </div>
        </div>
      </form>

      <!-- Confirmation -->
      <div class="thanks" id="thanks" style="display:none;">
        Thank you.
        <small>Your request has been sent — I'll get back to you soon.</small>
      </div>
    </section>
  </main>
