  <main>
    <section class="wrap page-head">
      <h1>Design</h1>
      <p>Graphic · Visual Identity</p>
    </section>

    <section class="wrap">
      <!-- Masonry ("tetris") layout: tiles keep their natural proportions and
           pack together, so mixed formats sit side by side. The title shows
           only when a work is opened (one line at the bottom of the viewer). -->
      <div class="grid--masonry">
        <!-- Carousel of every CARTAZ file (cover: CARTAZ FINAL) -->
        <div class="item item--tile" data-type="gallery" data-title="FLYER CENA"
             data-images="assets/design/CARTAZ%20FINAL.png|assets/design/CARTAZ%20DJ%20DADDA.png|assets/design/CARTAZ%20DJ%20MONZZ%20(1).png|assets/design/CARTAZ%20DJ%20TEE%20(1).png|assets/design/CARTAZ%20SIPPINPURPP.png|assets/design/YURI%20CARTAZ%20FACE%201%20(1).png">
          <img src="assets/design/CARTAZ%20FINAL.png" alt="Flyer evento CENA" loading="lazy" />
        </div>

        <!-- Digital print: design + real example -->
        <div class="item item--tile" data-type="gallery" data-title="DIGITAL PRINT"
             data-images="assets/design/cover-design.jpg|assets/design/longsleeve.png">
          <img src="assets/design/cover-design.jpg" alt="Digital print" loading="lazy" />
        </div>

        <!-- Screen print: design + real example -->
        <div class="item item--tile" data-type="gallery" data-title="SCREEN PRINT (in collaboration with salto)"
             data-images="assets/design/Cena_Design_1_VIEW.png|assets/design/DSCF4157.JPG">
          <img src="assets/design/Cena_Design_1_VIEW.png" alt="Screen print" loading="lazy" />
        </div>

        <!-- Single image, no title -->
        <div class="item item--tile" data-type="image" data-full="assets/design/design%20espelho.png">
          <img src="assets/design/design%20espelho.png" alt="" loading="lazy" />
        </div>
      </div>
    </section>
  </main>
